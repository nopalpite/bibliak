[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `app` is only importable when pytest is invoked as
# `python -m pytest` (which prepends the CWD to sys.path). Declaring it
# explicitly makes a plain `pytest` invocation work too — that's what CI runs.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
