{% extends "layout.html" %}

{% block title %}Administration — BIBLIAK{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <p class="kicker mb-1">Réglages</p>
  <h1 class="font-display text-3xl font-medium mb-1">Administration</h1>
  <p class="text-sm mb-6" style="color: var(--ink-muted);">Paramètres de l'application, référentiels et sauvegarde de la collection.</p>

  <div class="flex gap-1 p-1 rounded-lg mb-6 overflow-x-auto" style="background: var(--surface-muted);" id="admin-tabs-bar">
    <button
      type="button"
      onclick="activateAdminTab(this, 'settings')"
      hx-get="{{ url_for('admin.tab', name='settings') }}" hx-target="#admin-content"
      class="admin-tab px-4 py-2 rounded-md text-sm whitespace-nowrap transition-colors admin-tab-active"
      data-tab="settings"
    >Paramètres</button>
    <button
      type="button"
      onclick="activateAdminTab(this, 'references')"
      hx-get="{{ url_for('admin.tab', name='references') }}" hx-target="#admin-content"
      class="admin-tab px-4 py-2 rounded-md text-sm whitespace-nowrap transition-colors"
      data-tab="references"
    >Référentiels</button>
    <button
      type="button"
      onclick="activateAdminTab(this, 'export_import')"
      hx-get="{{ url_for('admin.tab', name='export_import') }}" hx-target="#admin-content"
      class="admin-tab px-4 py-2 rounded-md text-sm whitespace-nowrap transition-colors"
      data-tab="export_import"
    >Import / Export</button>
  </div>

  <div id="admin-content">
    {% include "admin/settings.html" %}
  </div>
</div>

<style>
  .admin-tab { color: var(--ink-muted); }
  .admin-tab-active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
</style>

<script>
  function activateAdminTab(button, name) {
    document.querySelectorAll('#admin-tabs-bar .admin-tab').forEach((b) => {
      b.classList.remove('admin-tab-active');
    });
    button.classList.add('admin-tab-active');
  }
</script>
{% endblock %}
