{#- Command palette: Ctrl/Cmd+K from any page. Books come from
    books.quick_search (live), actions are static. All DOM is built with the
    DOM API — a book title is user data and never goes through innerHTML. -#}
<div id="command-palette" class="fixed inset-0 hidden" style="z-index: 60;" role="dialog" aria-modal="true" aria-label="{{ t('Quick search') }}">
  <div class="absolute inset-0" style="background: rgba(20, 20, 18, .5);" onclick="closePalette()"></div>
  <div class="card relative mx-auto overflow-hidden" style="margin-top: 10vh; width: min(40rem, calc(100% - 2rem)); box-shadow: 0 30px 60px -20px rgba(0,0,0,.55);">
    <div class="flex items-center gap-3 px-4 py-3 border-b" style="border-color: var(--border);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color: var(--ink-muted); flex-shrink: 0;" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list"
             autocomplete="off" spellcheck="false" aria-label="{{ t('Quick search') }}"
             placeholder="{{ t('Search a book or an action…') }}"
             class="flex-1 min-w-0 bg-transparent text-base" style="outline: none; color: var(--ink);">
      <kbd class="text-[11px] px-1.5 py-0.5 rounded border" style="border-color: var(--border); color: var(--ink-muted);">Esc</kbd>
    </div>
    <div id="palette-list" role="listbox" class="overflow-y-auto p-2" style="max-height: 60vh;"></div>
    <div class="flex gap-4 px-4 py-2 text-[11px] border-t" style="border-color: var(--border); background: var(--surface-muted); color: var(--ink-muted);">
      <span>↑ ↓ {{ t('navigate') }}</span>
      <span>↵ {{ t('open') }}</span>
      <span>Esc {{ t('close') }}</span>
    </div>
  </div>
</div>

<style>
  .palette-item { display: flex; align-items: center; gap: .75rem; width: 100%; padding: .5rem .75rem; border-radius: .5rem; text-align: left; cursor: pointer; color: var(--ink); }
  .palette-item[aria-selected="true"] { background: var(--accent-soft); }
  .palette-thumb { width: 28px; height: 42px; flex-shrink: 0; border-radius: 3px; overflow: hidden; background: var(--surface-muted); border: 1px solid var(--border); }
  .palette-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .palette-group { padding: .5rem .75rem .25rem; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
</style>

<script>
  (function () {
    const PALETTE_I18N = {
      books: {{ t('Books')|tojson }},
      recent: {{ t('Recently added')|tojson }},
      actions: {{ t('Actions')|tojson }},
      noResults: {{ t('No result')|tojson }},
      error: {{ t('Could not search: check your connection.')|tojson }},
    };
    const SEARCH_URL = {{ url_for('books.quick_search')|tojson }};
    const ACTIONS = [
      { label: {{ t('Collection')|tojson }}, url: {{ url_for('main.index')|tojson }} },
      { label: {{ t('Add manually')|tojson }}, url: {{ url_for('books.new')|tojson }} },
      { label: {{ t('Scan a barcode')|tojson }}, url: {{ url_for('scan.scan_page')|tojson }} },
      { label: {{ t('Stats')|tojson }}, url: {{ url_for('main.stats')|tojson }} },
      { label: {{ t('Administration')|tojson }}, url: {{ url_for('admin.home')|tojson }} },
      { label: {{ t('Change theme')|tojson }}, run: function () { toggleTheme(); } },
    ];

    const root = document.getElementById('command-palette');
    const input = document.getElementById('palette-input');
    const list = document.getElementById('palette-list');
    let options = [];
    let active = -1;
    let previousFocus = null;
    let debounce = null;
    let controller = null;

    function isOpen() { return !root.classList.contains('hidden'); }

    function setActive(index) {
      if (!options.length) { active = -1; input.removeAttribute('aria-activedescendant'); return; }
      active = (index + options.length) % options.length;
      options.forEach(function (option, i) {
        option.setAttribute('aria-selected', i === active ? 'true' : 'false');
      });
      input.setAttribute('aria-activedescendant', options[active].id);
      options[active].scrollIntoView({ block: 'nearest' });
    }

    function addGroup(title) {
      const heading = document.createElement('div');
      heading.className = 'palette-group';
      heading.setAttribute('role', 'presentation');
      heading.textContent = title;
      list.appendChild(heading);
    }

    function addOption(element) {
      element.id = 'palette-option-' + options.length;
      element.className = 'palette-item';
      element.setAttribute('role', 'option');
      element.setAttribute('aria-selected', 'false');
      element.tabIndex = -1;
      const index = options.length;
      element.addEventListener('mousemove', function () { if (active !== index) setActive(index); });
      list.appendChild(element);
      options.push(element);
    }

    function bookOption(book) {
      const link = document.createElement('a');
      link.href = book.url;

      const thumb = document.createElement('span');
      thumb.className = 'palette-thumb';
      if (book.cover) {
        const image = document.createElement('img');
        image.src = book.cover;
        image.alt = '';
        thumb.appendChild(image);
      }

      const text = document.createElement('span');
      text.className = 'min-w-0 flex-1';
      const title = document.createElement('span');
      title.className = 'block text-sm font-medium truncate';
      title.textContent = book.title;
      text.appendChild(title);
      if (book.subtitle) {
        const subtitle = document.createElement('span');
        subtitle.className = 'block text-xs truncate';
        subtitle.style.color = 'var(--ink-muted)';
        subtitle.textContent = book.subtitle;
        text.appendChild(subtitle);
      }

      link.appendChild(thumb);
      link.appendChild(text);
      addOption(link);
    }

    function actionOption(action) {
      let element;
      if (action.url) {
        element = document.createElement('a');
        element.href = action.url;
      } else {
        element = document.createElement('button');
        element.type = 'button';
        element.addEventListener('click', function () { close(); action.run(); });
      }
      const label = document.createElement('span');
      label.className = 'text-sm';
      label.textContent = action.label;
      element.appendChild(label);
      addOption(element);
    }

    function render(books, query, failed) {
      list.replaceChildren();
      options = [];

      if (books.length) {
        addGroup(query ? PALETTE_I18N.books : PALETTE_I18N.recent);
        books.forEach(bookOption);
      }

      const needle = query.toLowerCase();
      const actions = ACTIONS.filter(function (a) { return !needle || a.label.toLowerCase().includes(needle); });
      if (actions.length) {
        addGroup(PALETTE_I18N.actions);
        actions.forEach(actionOption);
      }

      if (!options.length || failed) {
        const message = document.createElement('p');
        message.className = 'px-3 py-6 text-sm text-center';
        message.style.color = 'var(--ink-muted)';
        message.textContent = failed ? PALETTE_I18N.error : PALETTE_I18N.noResults;
        list.appendChild(message);
      }
      setActive(options.length ? 0 : -1);
    }

    function refresh() {
      const query = input.value.trim();
      if (controller) controller.abort();
      controller = new AbortController();
      fetch(SEARCH_URL + '?q=' + encodeURIComponent(query), {
        headers: { 'Accept': 'application/json' },
        signal: controller.signal,
      })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function (books) { render(books, query, false); })
        .catch(function (error) { if (error.name !== 'AbortError') render([], query, true); });
    }

    function open() {
      if (isOpen()) return;
      previousFocus = document.activeElement;
      root.classList.remove('hidden');
      input.value = '';
      render([], '', false);
      refresh();
      input.focus();
    }

    function close() {
      if (!isOpen()) return;
      root.classList.add('hidden');
      if (controller) controller.abort();
      if (previousFocus && previousFocus.focus) previousFocus.focus();
    }

    window.openPalette = open;
    window.closePalette = close;

    input.addEventListener('input', function () {
      clearTimeout(debounce);
      debounce = setTimeout(refresh, 150);
    });

    root.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown') { event.preventDefault(); setActive(active + 1); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); setActive(active - 1); }
      else if (event.key === 'Enter') { event.preventDefault(); if (options[active]) options[active].click(); }
      else if (event.key === 'Escape') { event.preventDefault(); close(); }
      else if (event.key === 'Tab') { event.preventDefault(); input.focus(); }
    });

    document.addEventListener('keydown', function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        if (isOpen()) close(); else open();
      }
    });

    if (/Mac|iPhone|iPad/.test(navigator.platform)) {
      document.querySelectorAll('.palette-kbd').forEach(function (el) { el.textContent = '⌘ K'; });
    }
  })();
</script>
