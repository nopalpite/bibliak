<div class="card p-5 flex items-center gap-3"
     hx-post="{{ url_for('scan.retry_search') }}"
     hx-trigger="load delay:{{ delay_ms }}ms"
     hx-target="#result-zone"
     hx-swap="innerHTML">
  <span class="inline-block w-2 h-2 rounded-full flex-shrink-0 animate-pulse" style="background: var(--gilt);"></span>
  <p class="text-sm" style="color: var(--ink-muted);">
    {{ t('{source} isn\'t responding — retrying (attempt {attempt}/{max_attempts})…', source=source_name, attempt=attempt, max_attempts=max_attempts) }}
  </p>
</div>
