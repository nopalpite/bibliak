<div id="champ-editeur-conteneur">
  <label class="block text-xs mb-1" style="color: var(--ink-muted);">Éditeur</label>
  <div class="flex gap-2">
    <select name="editeur_id" class="flex-1 px-3 py-2 rounded-lg border text-sm bg-transparent" style="border-color: var(--border);">
      <option value="">Aucun éditeur</option>
      {% for e in editeurs %}
      <option value="{{ e.id }}" {{ 'selected' if valeurs.editeur_id == e.id }}>{{ e.nom }}</option>
      {% endfor %}
    </select>
    <button type="button" onclick="afficherCreationEditeur()"
            class="px-3 py-2 rounded-lg border text-sm flex-shrink-0" style="border-color: var(--border); color: var(--ink-muted);"
            title="Créer un nouvel éditeur">
      + Éditeur
    </button>
  </div>

  {% if message %}
  <p class="text-xs mt-1.5" style="color: {{ 'var(--accent)' if erreur else 'var(--feuillage)' }};">
    {{ '⚠️' if erreur else '✓' }} {{ message }}
  </p>
  {% endif %}

  <div id="creation-editeur" class="{{ '' if erreur else 'hidden' }} mt-2 space-y-2">
    <input
      type="text" name="nom" id="nouvel-editeur-nom" placeholder="Nom du nouvel éditeur"
      value="{{ nom_saisi or '' }}"
      autocomplete="off" autocorrect="off"
      onkeydown="if (event.key === 'Enter') { event.preventDefault(); creerEditeurRapide(); }"
      class="w-full px-3 py-2 rounded-lg border text-sm bg-transparent" style="border-color: var(--border);">
    <button
      type="button"
      id="bouton-creer-editeur"
      class="bouton-primaire w-full px-3 py-2.5 rounded-lg text-sm"
    >Créer l'éditeur</button>
    <p class="text-xs" style="color: var(--ink-muted);">Astuce : la touche Entrée du clavier fonctionne aussi.</p>
  </div>
</div>
